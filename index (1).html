<html lang="en">
<head>

<style>
:root{--bg:#020617;--pn:#0f172a;--bd:#1e293b;--tx:#e8edf7;--mut:#8aa0bd;--pri:#1d5cff;--pt:#4d94ff;--ok:#34d399;--okb:#07281f;--no:#fb7185;--nob:#33101a;--nav:#0a1122;--ch:#131e36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme=light]{--bg:#f1f5f9;--pn:#fff;--bd:#d7dfeb;--tx:#0f172a;--mut:#5b6b82;--pt:#1d5cff;--ok:#0f7b4f;--okb:#dcf5e8;--no:#be123c;--nob:#fde4ea;--nav:#fff;--ch:#f1f5f9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}.mut{color:var(--mut)}.sm{font-size:.85rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--nav);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:20px;padding:12px 18px;overflow-x:auto}
.brand{font:700 1.3rem Fraunces,Georgia,serif;white-space:nowrap}
nav button.t{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font:600 1rem inherit;padding:6px 0;cursor:pointer;white-space:nowrap}
nav button.t.on{color:var(--pt);border-color:var(--pt)}
.sp{flex:1}
.w{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
h1{font:700 clamp(2rem,6vw,3rem)/1.1 Fraunces,Georgia,serif;margin:6px 0 10px}
h3{font-size:1.05rem;margin:22px 0 8px}h4{margin:0 0 6px}
.eye{color:var(--pt);font-size:.9rem}
.hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--bd);padding-bottom:20px;margin-bottom:22px;flex-wrap:wrap}
.g{display:grid;gap:18px}@media(min-width:900px){.g{grid-template-columns:1fr 340px}}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:22px;margin-bottom:18px}
.pn h3:first-child{margin-top:0}

.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip .n{font:.8rem "JetBrains Mono",monospace;opacity:.7;margin-left:6px}
.two{display:grid;gap:16px}@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}
.seg{display:flex;background:var(--ch);border:1px solid var(--bd);border-radius:12px;padding:4px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:9px;border-radius:9px;font:600 .9rem inherit;cursor:pointer}
.seg button.on{background:var(--bg);color:var(--tx)}
.ft{border-top:1px solid var(--bd);margin-top:22px;padding-top:18px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:14px 26px;font:700 1rem inherit;cursor:pointer}
.btn:disabled{opacity:.4}.btn.full{width:100%;margin-top:12px}

.ex{margin-top:12px;border-left:4px solid var(--pri);padding:6px 14px}.ex ol{margin:0;padding-left:20px}.ex p{margin:0}

.qtop{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px}
.huge{font-size:3.4rem;font-weight:700;text-align:center}.tc{text-align:center}

input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--ch);color:var(--tx);font:inherit;margin:12px 0}
.fg{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.fg svg,.opt svg{background:#fff;border:1px solid #8795ab;border-radius:6px;width:72px;height:72px;flex:none}.opt{align-items:center}
.dl{font-size:.72rem;padding:2px 9px;border-radius:99px;color:#fff;font-weight:700}.d0{background:#16a34a}.d1{background:#d97706}.d2{background:#dc2626}
a{color:var(--pt)}

<nav><span class="brand">Civil Service Reviewer<small style="display:block;font:600 .7rem 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--pt)">Made by Jelaica Baron</small></span>

<script>

// [category, question, [correct, ...wrong], explanation]
const BANK=[
["Vocabulary","Choose the synonym of EPHEMERAL.",["Short-lived","Eternal","Heavy","Bright"],"Ephemeral means lasting a very short time."],
["Vocabulary","Choose the antonym of BENEVOLENT.",["Malevolent","Kind","Generous","Gentle"],"Benevolent means well-meaning; malevolent means wishing harm."],
["Vocabulary","METICULOUS means:",["Extremely careful about details","Careless","Lazy","Quick-tempered"],"A meticulous person pays close attention to detail."],
["Vocabulary","Choose the synonym of CANDID.",["Frank","Secretive","Rude","Shy"],"Candid means honest and straightforward."],
["Vocabulary","Choose the antonym of SCARCE.",["Abundant","Rare","Limited","Few"],"Scarce means in short supply."],
["Vocabulary","AMBIGUOUS means:",["Open to more than one meaning","Very clear","Very large","Easily broken"],"An ambiguous statement can be understood in different ways."],
["Grammar","Neither of the candidates ___ qualified.",["is","are","were","have been"],"Neither is singular, so it takes a singular verb."],
["Grammar","Choose the correct spelling.",["Accommodate","Accomodate","Acommodate","Accomadate"],"Accommodate has double c and double m."],
["Grammar","She is the ___ of the two sisters.",["taller","tallest","more tall","most tall"],"Use the comparative when comparing two."],
["Grammar","Each of the employees must submit ___ report on time.",["his or her","their own","our","its"],"Each is singular, so a singular pronoun is used."],
["Grammar","Either the manager or the clerks ___ responsible.",["are","is","was","has been"],"The verb agrees with the nearer subject, clerks."],
["Grammar","The committee ___ its decision yesterday.",["announced","announce","have announced","announcing"],"Past tense with a singular collective noun."],
["Numerical","What is 15% of 240?",["36","32","40","24"],"0.15 × 240 = 36."],
["Numerical","3/4 + 2/3 = ?",["17/12","5/7","5/12","7/12"],"9/12 + 8/12 = 17/12."],
["Numerical","Two numbers are in the ratio 3:5 and their sum is 160. What is the larger number?",["100","60","80","96"],"160 ÷ 8 = 20, and 5 × 20 = 100."],
["Numerical","Find the average of 12, 18, 24, 30 and 36.",["24","22","26","30"],"Sum is 120; 120 ÷ 5 = 24."],
["Numerical","Ana finishes a job in 6 days, Ben in 12 days. How many days if they work together?",["4","9","5","3"],"1/6 + 1/12 = 3/12 = 1/4, so 4 days."],
["Numerical","An item costs ₱800 with a 25% discount. What is the sale price?",["₱600","₱200","₱640","₱700"],"800 − 200 = 600."],
["Numerical","Next number: 2, 6, 18, 54, ?",["162","108","144","216"],"Each term is multiplied by 3."],
["Numerical","Simple interest on ₱5,000 at 4% for 3 years?",["₱600","₱200","₱500","₱650"],"5000 × 0.04 × 3 = 600."],
["Analytical","All public servants must be honest. Ramon is a public servant. Therefore:",["Ramon must be honest","Ramon is not honest","Ramon is rich","Nothing can be concluded"],"Valid deduction from the two premises."],
["Analytical","Doctor : Hospital :: Teacher : ?",["School","Student","Book","Chalk"],"A doctor works in a hospital; a teacher works in a school."],
["Analytical","Next letter: A, C, F, J, ?",["O","N","M","P"],"Gaps grow by 1: +2, +3, +4, +5."],
["Analytical","Which does not belong?",["Carrot","Mango","Apple","Banana"],"Carrot is a vegetable; the others are fruits."],
["Analytical","Ana is taller than Ben. Ben is taller than Carl. Who is the shortest?",["Carl","Ben","Ana","Cannot be determined"],"Ana > Ben > Carl."],
["Philippine Constitution & Laws","The Code of Conduct and Ethical Standards for Public Officials and Employees is:",["RA 6713","RA 3019","RA 7160","RA 9165"],"RA 6713 is the Code of Conduct. RA 3019 is the Anti-Graft law."],
["Philippine Constitution & Laws","The Anti-Graft and Corrupt Practices Act is:",["RA 3019","RA 6713","RA 7160","RA 8293"],"RA 3019, enacted in 1960."],
["Philippine Constitution & Laws","The Civil Service Commission is composed of a Chairman and how many Commissioners?",["Two","Three","Four","Five"],"Chairman plus two Commissioners (1987 Constitution, Art. IX-B)."],
["Philippine Constitution & Laws","The term of the President of the Philippines is:",["Six years, no reelection","Four years, with reelection","Six years, with one reelection","Five years"],"Single six-year term."],
["Philippine Constitution & Laws","Minimum age to be a Senator of the Philippines:",["35","30","40","25"],"At least 35 years old on election day."],
["Philippine Constitution & Laws","The Bill of Rights is found in which Article of the 1987 Constitution?",["Article III","Article II","Article IV","Article VI"],"Article III is the Bill of Rights."],
["Philippine Constitution & Laws","SALN stands for:",["Statement of Assets, Liabilities and Net Worth","Statement of Annual Local Needs","Summary of Assets and Local Notes","Schedule of Assets, Loans and Net income"],"Public officials must file a SALN under RA 6713."],
["Philippine Constitution & Laws","Philippine Independence was proclaimed on:",["June 12, 1898","July 4, 1946","August 13, 1898","March 31, 1901"],"Proclaimed in Kawit, Cavite on June 12, 1898."],
["Vocabulary","Synonym of DILIGENT.",["Hardworking","Lazy","Careless","Slow"],"Diligent means showing steady, careful effort."],
["Vocabulary","Antonym of FRUGAL.",["Wasteful","Thrifty","Careful","Economical"],"Frugal means economical, so wasteful is the opposite."],
["Vocabulary","OBSOLETE means:",["No longer in use","Brand new","Very valuable","Popular"],"Obsolete describes something outdated or no longer used."],
["Vocabulary","Synonym of PRAGMATIC.",["Practical","Dreamy","Emotional","Stubborn"],"A pragmatic person focuses on what works in reality."],
["Vocabulary","Antonym of TRANSPARENT.",["Opaque","Clear","Thin","Bright"],"Transparent means see-through; opaque blocks light."],
["Vocabulary","VERBOSE means:",["Using too many words","Silent","Brief","Angry"],"Verbose speech or writing is wordy."],
["Vocabulary","Synonym of RELUCTANT.",["Unwilling","Eager","Happy","Certain"],"Reluctant means hesitant or unwilling."],
["Vocabulary","Antonym of EXPAND.",["Contract","Grow","Stretch","Enlarge"],"Expand means to grow bigger; contract means to shrink."],
["Grammar","The news ___ shocking.",["was","were","are","have been"],"News is singular even though it ends in s."],
["Grammar","Choose the correct sentence.",["I have been working here since 2020.","I am working here since 2020.","I work here since 2020.","I was working here since 2020 until now."],"Use present perfect continuous with since for an action that continues to now."],
["Grammar","The new policy will ___ all employees.",["affect","effect","affects","effects"],"Affect is the verb (to influence); effect is usually a noun. After will, use the base form."],
["Grammar","___ going to submit the report tomorrow.",["They’re","Their","There","Theyre"],"They’re = they are."],
["Grammar","Between you and ___, the plan is risky.",["me","I","myself","mine"],"Use the object pronoun after a preposition."],
["Grammar","The number of applicants ___ increasing.",["is","are","were","have been"],"The number of is singular; a number of is plural."],
["Grammar","If I ___ you, I would accept the offer.",["were","was","am","will be"],"Use were for contrary-to-fact conditions."],
["Grammar","Choose the correct spelling.",["Separate","Seperate","Seprate","Separete"],"Separate has an a after the p."],
["Analytical","Next number: 1, 4, 9, 16, ?",["25","20","24","36"],"These are squares: 1², 2², 3², 4², so the next is 5² = 25."],
["Analytical","Pen : Write :: Knife : ?",["Cut","Sharp","Kitchen","Metal"],"A pen is used to write; a knife is used to cut."],
["Analytical","Which does not belong?",["Cube","Square","Circle","Triangle"],"Cube is three-dimensional; the others are flat shapes."],
["Analytical","All birds have wings. A sparrow is a bird. Therefore:",["A sparrow has wings","A sparrow cannot fly","All winged animals are birds","No conclusion"],"The sparrow belongs to the group of birds, so it has wings."],
["Analytical","Next number: 3, 6, 11, 18, 27, ?",["38","36","40","34"],"Differences are 3, 5, 7, 9, so the next difference is 11: 27 + 11 = 38."],
["Analytical","If today is Wednesday, what day will it be 10 days from now?",["Saturday","Friday","Sunday","Thursday"],"10 ÷ 7 leaves 3, so Wednesday + 3 days = Saturday."],
["Analytical","What is the angle between the clock hands at 3:00?",["90°","60°","120°","45°"],"Each hour mark is 30°, and 3 hours × 30° = 90°."],
["Analytical","If CAT = 3120 (C=3, A=1, T=20), then DOG = ?",["4157","4167","3157","4147"],"D=4, O=15, G=7, so DOG = 4 15 7 = 4157."],
["Philippine Constitution & Laws","RA 7160 is the:",["Local Government Code of 1991","Data Privacy Act","Anti-Graft Law","Code of Conduct for Public Officials"],"RA 7160 governs local government units."],
["Philippine Constitution & Laws","RA 10173 is the:",["Data Privacy Act of 2012","Cybercrime Prevention Act","Ease of Doing Business Act","Anti-Red Tape Act"],"RA 10173 protects personal information."],
["Philippine Constitution & Laws","RA 11032 is known as the:",["Ease of Doing Business and Efficient Government Service Delivery Act","Data Privacy Act","Local Government Code","Comprehensive Dangerous Drugs Act"],"RA 11032 (2018) amended the Anti-Red Tape Act."],
["Philippine Constitution & Laws","RA 9165 is the:",["Comprehensive Dangerous Drugs Act of 2002","Anti-Graft Law","Data Privacy Act","Anti-Money Laundering Act"],"RA 9165 covers illegal drugs."],
["Philippine Constitution & Laws","Article IX-B of the 1987 Constitution deals with the:",["Civil Service Commission","Commission on Elections","Commission on Audit","Judiciary"],"IX-A is common provisions, IX-B Civil Service, IX-C COMELEC, IX-D COA."],
["Philippine Constitution & Laws","The term of a Senator is:",["Six years, up to two consecutive terms","Three years, up to three terms","Six years, no limit","Four years, up to two terms"],"Senators serve six years with a limit of two consecutive terms."],
["Philippine Constitution & Laws","The term of a Member of the House of Representatives is:",["Three years, up to three consecutive terms","Six years, up to two terms","Four years, up to two terms","Three years, no limit"],"House members serve three years, maximum three consecutive terms."],
["Philippine Constitution & Laws","How many Senators are there in the Philippines?",["24","12","20","30"],"The Senate has 24 members elected at large."],
["Philippine Constitution & Laws","“Public office is a public trust” is found in which Article?",["Article XI","Article III","Article VII","Article IX"],"Article XI is Accountability of Public Officers."],
["Philippine Constitution & Laws","The eight rays of the sun in the Philippine flag represent:",["The first eight provinces that revolted against Spain","The eight major islands","The eight national heroes","The eight regions"],"They stand for the first eight provinces placed under martial law by Spain."],
["Philippine Constitution & Laws","The first President of the Philippines was:",["Emilio Aguinaldo","Manuel Quezon","Jose P. Laurel","Sergio Osmeña"],"Aguinaldo led the First Philippine Republic in 1899."],
["Philippine Constitution & Laws","The writ of habeas corpus protects a person from:",["Illegal detention","Illegal search","Unfair taxation","Libel"],"It compels authorities to justify a person’s detention."],
["General Information","The longest river in the Philippines is the:",["Cagayan River","Pasig River","Agusan River","Pampanga River"],"The Cagayan River in northern Luzon is the longest."],
["General Information","The highest mountain in the Philippines is:",["Mount Apo","Mount Pulag","Mount Mayon","Mount Kanlaon"],"Mount Apo in Mindanao stands about 2,954 meters."],
["General Information","The largest island in the Philippines is:",["Luzon","Mindanao","Samar","Palawan"],"Luzon is the largest; Mindanao is second."]
];

// Generated numerical questions, each with a worked solution
(()=>{
let sd=20260;const R=()=>(sd=(sd*1103515245+12345)%2147483648)/2147483648;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pk=a=>a[Math.floor(R()*a.length)];
const seen=new Set(BANK.map(b=>b[1])),peso=n=>"₱"+n.toLocaleString("en-US");
const mk=(q,a,sol,f=x=>String(x))=>{if(seen.has(q))return;seen.add(q);const st=Math.max(1,Math.round(a/10)),w=[];for(const x of [a+st,a-st,a+2*st,a*2,a-2*st,a+3*st,Math.round(a/2)]){if(x>0&&x!==a&&!w.includes(x))w.push(x);if(w.length==3)break}BANK.push(["Numerical",q,[a,...w].map(x=>f(x)),sol])};
const nm=["Ana","Ben","Carla","Dan","Ella","Fred","Gina","Hector"],tk=["finish a report","paint a wall","sort the files"];
const wp=[[6,12],[10,15],[12,24],[20,30],[15,30],[18,9],[30,60],[24,8],[21,28],[14,35],[4,12],[45,90]];
for(let n=0;n<45;n++){
 const p=pk([5,10,15,20,25,30,35,40,45,60,75]),N=20*ri(3,60);
 mk(`What is ${p}% of ${N}?`,p*N/100,`${p}% = ${p}/100. ${p}/100 × ${N} = ${p*N/100}.`);
 const P=100*ri(4,60),d=pk([10,15,20,25,30,40]),dis=P*d/100;
 mk(`A jacket priced at ${peso(P)} is sold with a ${d}% discount. What is the sale price?`,P-dis,`Discount = ${d}% × ${P} = ${dis}. Sale price = ${P} − ${dis} = ${P-dis}.`,peso);
 const a=ri(1,7),b=ri(1,9),m=ri(2,20),S=(a+b)*m,L=Math.max(a,b);
 if(a!==b)mk(`Two numbers are in the ratio ${a}:${b} and their sum is ${S}. What is the larger number?`,L*m,`Total parts = ${a} + ${b} = ${a+b}. One part = ${S} ÷ ${a+b} = ${m}. Larger = ${L} × ${m} = ${L*m}.`);
 const av=ri(40,90),xs=[0,0,0,0].map(()=>av+ri(-15,15)),last=5*av-xs.reduce((u,v)=>u+v,0);
 mk(`Find the average of ${[...xs,last].join(", ")}.`,av,`Sum = ${5*av}. Average = ${5*av} ÷ 5 = ${av}.`);
 const [wa,wb]=pk(wp),x=nm[n%8],y=nm[(n+3)%8],t=pk(tk),wd=wa*wb/(wa+wb);
 mk(`${x} can ${t} in ${wa} days while ${y} can do it in ${wb} days. Working together, how many days will they take?`,wd,`Combined rate = 1/${wa} + 1/${wb} = ${wa+wb}/${wa*wb} per day. Days = ${wa*wb}/${wa+wb} = ${wd}.`);
 const IP=1000*ri(2,50),r=pk([3,4,5,6,8,10]),yr=ri(1,5),I=IP*r*yr/100;
 mk(`Find the simple interest on ${peso(IP)} at ${r}% per year for ${yr} years.`,I,`I = P × r × t = ${IP} × ${r}% × ${yr} = ${I}.`,peso);
 const sp=5*ri(6,18),h=ri(2,9),k=n%3;
 if(k===0)mk(`A bus travels at ${sp} km/h for ${h} hours. How far does it go (km)?`,sp*h,`Distance = speed × time = ${sp} × ${h} = ${sp*h} km.`);
 else if(k===1)mk(`A car covers ${sp*h} km in ${h} hours. What is its average speed (km/h)?`,sp,`Speed = distance ÷ time = ${sp*h} ÷ ${h} = ${sp} km/h.`);
 else mk(`How many hours will it take to travel ${sp*h} km at ${sp} km/h?`,h,`Time = distance ÷ speed = ${sp*h} ÷ ${sp} = ${h} hours.`);
 if(n%2===0){const s0=ri(1,30),df=ri(2,9),tm=[0,1,2,3].map(j=>s0+j*df);
 mk(`Find the next number: ${tm.join(", ")}, ?`,s0+4*df,`The pattern adds ${df} each time. ${s0+3*df} + ${df} = ${s0+4*df}.`)}
 else{const s0=ri(1,5),g=pk([2,3]),tm=[0,1,2,3].map(j=>s0*g**j);
 mk(`Find the next number: ${tm.join(", ")}, ?`,s0*g**4,`The pattern multiplies by ${g} each time. ${s0*g**3} × ${g} = ${s0*g**4}.`)}
 const C=100*ri(3,50),mu=pk([10,15,20,25,30,40,50]),pf=C*mu/100;
 mk(`A seller buys an item for ${peso(C)} and sells it at a ${mu}% profit. What is the selling price?`,C+pf,`Profit = ${mu}% × ${C} = ${pf}. Selling price = ${C} + ${pf} = ${C+pf}.`,peso);
 const c0=ri(3,60);
 mk(`The sum of three consecutive integers is ${3*c0+3}. What is the smallest?`,c0,`Let the integers be n, n+1, n+2. Then 3n + 3 = ${3*c0+3}, so n = ${c0}.`);
}
})();

// Questions matched to the CSC syllabus: [Subject · Subtopic, question, [correct, ...wrong], solution]
BANK.push(
['Verbal Ability · Sentence Completion','The manager praised the staff for their ___ in meeting the deadline.',['diligence','laziness','confusion','reluctance'],'Praise fits a positive quality, and diligence is the only positive choice.'],
['Verbal Ability · Sentence Completion','She was tired; ___, she finished the report.',['nevertheless','therefore','because','for example'],'Nevertheless shows contrast between being tired and still finishing.'],

<h3>2. Choose Topic</h3><div class="chips">${chip("topic","All","All Topics",S.topic==="All")}${tops.map(t=>chip("topic",t,t.split(" \u00b7 ")[1]||t,S.topic===t,cnt(b=>b[0]===t))).join("")}</div>
<div class="two"><div><h3>3. Number of Questions</h3><div class="chips mono">${[10,20,50,100,0].map(x=>chip("cnt",x,x||"All",S.cnt===x)).join("")}</div></div><div><h3>4. Practice Mode</h3><div class="seg">${[["study","Untimed Study"],["timed","Timed Drill"]].map(([v,t])=>`<button class="${S.mode===v?"on":""}" data-a="mode" data-v="${v}">${t}</button>`).join("")}</div><p class="mut sm">${S.mode==="study"?"Untimed practice with immediate answer explanations.":"60 seconds per question. Unanswered items count as missed."}</p></div></div>
<h3>5. Question Pool</h3><div class="chips">${chip("pool","all","All Questions",S.pool==="all")}${chip("pool","bm",`Bookmarked (${DB.bm.length})`,S.pool==="bm")}${chip("pool","miss",`Previously Missed (${DB.miss.length})`,S.pool==="miss")}</div>
<h3>6. Difficulty</h3><div class="chips">${["All","Easy","Medium","Hard"].map(x=>chip("diff",x,x,S.diff===x)).join("")}</div>
<div class="row ft"><span class="mut">Ready to draw <b class="mono">${k}</b> questions \u00b7 Passing target <b class="mono">80%</b></span><button class="btn" data-a="start" ${n?"":"disabled"}>Start Reviewing</button></div></section><aside>${snapshot()}${breakdown()}</aside></div>`}
function feedback(b){const ok=Q.pick>=0&&Q.opts[Q.pick].ok,right=Q.opts.find(x=>x.ok).t,top=b[0].split(" \u00b7 ")[1]||"",st=/Numerical|Analytical/.test(b[0])||/Step 1:/.test(b[3]),steps=b[3].split(/(?<=[.?!])\s+(?=[A-Z0-9\u20b1(\u2212])/);
return `<div class="fb ${ok?"g":"b"}"><b>${ok?"Correct!":Q.pick<0?"Time is up.":"Not quite."}</b> ${ok||Q.pick<0?"":`You chose <u>${esc(Q.opts[Q.pick].t)}</u>. `}The correct answer is <u>${esc(right)}</u>.</div><div class="ex"><h4>${st?"Step-by-step solution":"Explanation"}</h4>${st&&steps.length>1?`<ol>${steps.map(s=>`<li>${esc(s.replace(/^Step \d+:\s*/,""))}</li>`).join("")}</ol>`:`<p>${esc(b[3])}</p>`}</div><div class="tip"><b>Exam tip:</b> ${esc(TIP[top]||"Eliminate wrong options first, then verify your choice.")}</div>`}
function vQuiz(){const b=Q.deck[Q.i];return `<div class="qtop"><span class="mut">${esc(b[0])} &middot; <b class="dl d${b.d}">${DL[b.d]}</b></span><span class="mono">${Q.i+1} / ${Q.deck.length}${S.mode==="timed"?` \u00b7 <b id="tm">${Q.t}s</b>`:""}</span></div><div class="bar q"><i style="width:${Q.i/Q.deck.length*100}%"></i></div>
<section class="pn"><div class="row" style="flex-wrap:nowrap"><div class="q">${esc(b[1])}${b[4]?`<div class="fg">${b[4]}</div>`:""}</div><button class="star" data-a="bmq" title="Bookmark">${DB.bm.includes(b.id)?"\u2605":"\u2606"}</button></div>${Q.opts.map((x,k)=>`<button class="opt${Q.done?(x.ok?" ok":k===Q.pick?" no":""):""}" data-a="pick" data-v="${k}" ${Q.done?"disabled":""}><b>${"ABCDE"[k]}</b><span>${x.t[0]==="<"?x.t:esc(x.t)}</span></button>`).join("")}${Q.done?feedback(b)+`<button class="btn full" data-a="next">${Q.i+1>=Q.deck.length?"See Results":"Next Question"}</button>`:""}</section><div class="row mut"><span>Score: ${Q.score}</span><a href="#" data-a="quit">Quit session</a></div>`}
function vResults(){const n=Q.deck.length,p=Math.round(Q.score/n*100);return `<section class="pn tc"><div class="huge mono">${p}%</div><p>${Q.score} of ${n} correct \u00b7 ${p>=80?"You are at passing level. Keep it up!":"Below the 80% passing target. Review the missed items and try again."}</p>${Q.miss.length?`<button class="btn full" data-a="retry">Retry ${Q.miss.length} missed question${Q.miss.length>1?"s":""}</button>`:""}<button class="btn2 full" data-a="nav" data-v="practice">New session</button><button class="btn2 full" data-a="nav" data-v="history">View history</button></section>`}
function bankList(){const q=BQ.toLowerCase(),l=pool().filter(b=>!q||b[1].toLowerCase().includes(q)||b[0].toLowerCase().includes(q));return l.slice(0,LIM).map(b=>`<div class="bi"><details><summary><small class="mut">${esc(b[0])} &middot; <b class="dl d${b.d}">${DL[b.d]}</b></small><br>${esc(b[1])}</summary>${b[4]?`<div class="fg">${b[4]}</div>`:""}${b[2].map((x,k)=>`<div class="bo${k?"":" ok"}">${k?"":"\u2714 "}${x[0]==="<"?x:esc(x)}</div>`).join("")}<div class="ex"><p>${esc(b[3])}</p></div></details><button class="star" data-a="bmb" data-v="${b.id}">${DB.bm.includes(b.id)?"\u2605":"\u2606"}</button></div>`).join("")+(l.length>LIM?`<p><button class="btn2" data-a="more">Show more (${l.length-LIM} left)</button></p>`:"")||`<p class="mut">No questions match.</p>`}
function vBank(){return `<h1>Question Bank</h1><p class="mut">Browse every question with its answer and solution. Tap a star to bookmark.</p><div class="chips">${chip("subj","All","All Subjects",S.subj==="All",BANK.length)}${SUBJ.map(s=>chip("subj",s,SL(s),S.subj===s,cnt(b=>subj(b)===s))).join("")}</div><input type="search" id="bq" placeholder="Search questions" value="${esc(BQ)}"><section class="pn" id="bl">${bankList()}</section>`}
function vHistory(){return `<h1>History</h1><section class="pn">${DB.hist.length?DB.hist.map(h=>`<div class="row" style="border-bottom:1px solid var(--bd);padding:10px 0"><span>${new Date(h.t).toLocaleString()}<br><small class="mut">${esc(h.l)} \u00b7 ${h.m==="timed"?"Timed":"Study"}</small></span><b class="mono" style="color:${h.s/h.n>=.8?"var(--ok)":"var(--no)"}">${h.s}/${h.n} \u00b7 ${Math.round(h.s/h.n*100)}%</b></div>`).join("")+`<p><button class="btn2" data-a="clearH">Clear history</button></p>`:`<p class="mut">No sessions yet. Start reviewing to see your scores here.</p>`}</section>`}
function vSyllabus(){return `<h1>Syllabus</h1><p class="mut">Tap any topic to practice it. Accuracy is recorded on this device.</p>${SUBJ.map(s=>{const ts=[...new Set(BANK.filter(b=>subj(b)===s).map(b=>b[0]))].sort();return `<section class="pn"><h3>${SL(s)} <span class="mono mut sm">${cnt(b=>subj(b)===s)} items \u00b7 ${acc(s)}</span></h3>${ts.map(t=>`<button class="sr" data-a="drill" data-v="${esc(t)}"><div class="row"><span>${esc(t.split(" \u00b7 ")[1]||t)}</span><span class="mono mut sm">${cnt(b=>b[0]===t)} items \u00b7 ${acc(t)}</span></div></button>`).join("")}</section>`}).join("")}`}
function render(){$("app").innerHTML={practice:vPractice,quiz:vQuiz,results:vResults,bank:vBank,history:vHistory,syllabus:vSyllabus}[view]();document.querySelectorAll("nav .t").forEach(b=>b.classList.toggle("on",b.dataset.v===(view==="quiz"||view==="results"?"practice":view)))}
function go(v){clearInterval(Q.iv);view=v;render();scrollTo(0,0)}
function begin(list,label){if(!list.length)return;Q.deck=sh(list).slice(0,S.cnt||list.length);Q.i=0;Q.score=0;Q.miss=[];Q.label=label;view="quiz";load()}
function load(){Q.opts=sh(Q.deck[Q.i][2].map((t,k)=>({t,ok:!k})));Q.done=0;Q.pick=-1;Q.t=60;clearInterval(Q.iv);if(S.mode==="timed")Q.iv=setInterval(()=>{if(--Q.t<=0)answer(-1);else{const e=$("tm");if(e)e.textContent=Q.t+"s"}},1000);render();scrollTo(0,0)}
function answer(k){if(Q.done)return;clearInterval(Q.iv);Q.done=1;Q.pick=k;const b=Q.deck[Q.i],ok=k>=0&&Q.opts[k].ok,st=DB.stat[b[0]]||(DB.stat[b[0]]=[0,0]);st[1]++;if(ok){st[0]++;Q.score++;DB.miss=DB.miss.filter(x=>x!==b.id)}else{Q.miss.push(b);if(!DB.miss.includes(b.id))DB.miss.push(b.id)}save();render()}
const tog=id=>{DB.bm=DB.bm.includes(id)?DB.bm.filter(x=>x!==id):[...DB.bm,id];save()};
const A={nav:v=>go(v),subj:v=>{S.subj=v;S.topic="All";render()},topic:v=>{S.topic=v;render()},cnt:v=>{S.cnt=+v;render()},mode:v=>{S.mode=v;render()},pool:v=>{S.pool=v;render()},diff:v=>{S.diff=v;render()},mock:v=>{S.cnt=0;S.mode="study";S.diff="All";S.pool="all";const g=(s,n)=>v==="hard"?[...sh(BANK.filter(b=>subj(b)===s&&b.d===2)),...sh(BANK.filter(b=>subj(b)===s&&b.d===1))].slice(0,n):sh(BANK.filter(b=>subj(b)===s)).slice(0,n);begin([...g("Verbal Ability",30),...g("Numerical Ability",30),...g("Analytical Ability",35),...g("General Information",5)],v==="hard"?"Hard mock exam (100 items)":"Mock exam (100 items)")},
theme:()=>{DB.th=DB.th==="light"?"dark":"light";document.documentElement.dataset.theme=DB.th;save();render()},
start:()=>begin(pool(),S.subj==="All"?"All subjects":(S.topic==="All"?S.subj:S.topic.split(" \u00b7 ")[1])),
quick:()=>{S.subj="All";S.topic="All";S.pool="all";S.cnt=10;begin(BANK,"Quick drill")},
pick:v=>answer(+v),next:()=>{Q.i++;if(Q.i>=Q.deck.length){DB.hist.unshift({t:Date.now(),s:Q.score,n:Q.deck.length,m:S.mode,l:Q.label});DB.hist=DB.hist.slice(0,100);save();go("results")}else load()},
quit:()=>go("practice"),bmq:()=>{tog(Q.deck[Q.i].id);render()},bmb:v=>{tog(v);$("bl").innerHTML=bankList()},more:()=>{LIM+=50;$("bl").innerHTML=bankList()},
drill:v=>{S.subj=v.split(" \u00b7 ")[0];S.topic=v.includes(" \u00b7 ")?v:"All";S.pool="all";go("practice")},
clearH:()=>{DB.hist=[];save();render()},retry:()=>{const m=Q.miss;Q.deck=sh(m);Q.i=0;Q.score=0;Q.miss=[];Q.label="Missed items";view="quiz";load()}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;e.preventDefault();A[t.dataset.a](t.dataset.v)});
document.addEventListener("input",e=>{if(e.target.id==="bq"){BQ=e.target.value;LIM=50;$("bl").innerHTML=bankList()}});
render();
</script>
</body>
</html>
